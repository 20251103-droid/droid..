<!-- contact.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重力擂台 · 百卡牌對決 | 聯絡我們</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">重力擂台</div>
    <nav class="navbar">
      <a href="index.html">首頁</a>
      <a href="products.html">產品介紹</a>
      <a href="contact.html" class="active">聯絡我們</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <h1>聯絡我們</h1>
      <p>有任何問題、建議或合作提案，歡迎與我們聯繫。</p>
    </section>

    <section class="contact-section">
      <div class="contact-info">
        <h2>聯絡資訊</h2>
        <ul class="contact-list">
          <li><span class="contact-icon">📧</span> 電子郵件：<a href="mailto:contact@gravityarena.com">contact@gravityarena.com</a></li>
          <li><span class="contact-icon">📞</span> 電話：+886 2 1234 5678</li>
          <li><span class="contact-icon">📍</span> 地址：台北市信義區遊戲路 100 號</li>
          <li><span class="contact-icon">🕒</span> 服務時間：週一至週五 09:00 – 18:00</li>
        </ul>
      </div>

      <div class="contact-form-wrapper">
        <h2>傳送訊息</h2>
        <form id="contactForm" class="contact-form">
          <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" placeholder="請輸入您的姓名" required>
          </div>
          <div class="form-group">
            <label for="email">電子郵件</label>
            <input type="email" id="email" name="email" placeholder="請輸入您的電子郵件" required>
          </div>
          <div class="form-group">
            <label for="subject">主旨</label>
            <input type="text" id="subject" name="subject" placeholder="請輸入主旨" required>
          </div>
          <div class="form-group">
            <label for="message">訊息內容</label>
            <textarea id="message" name="message" rows="5" placeholder="請輸入您的訊息" required></textarea>
          </div>
          <button type="submit" class="btn primary">送出訊息</button>
          <p id="formStatus" class="form-status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 重力擂台 · 百卡牌對決. 版權所有.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
